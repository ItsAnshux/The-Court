<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Friends — The Court</title>
<link rel="stylesheet" href="style.css" />
<style>
  .back-link { padding: 14px 18px 0; display: block; color: var(--text-dim); text-decoration: none; font-size: 14px; }
  .friend-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="app">
  <a href="index.html" class="back-link">← The Court</a>
  <div style="padding:18px;">
    <h2 style="margin:0 0 16px;">🤝 Friends</h2>
    <div id="friendsList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bfzigmdfgvoedqmfzmub.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_s-aORJHy624eU2s1qzuAqA_3s1xK51R";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AVATAR_PALETTE = [
  ["#7c5cff", "#ff5cad"], ["#ff8a5c", "#ff5c8a"], ["#5cffb0", "#5c9aff"],
  ["#ffd15c", "#ff5c5c"], ["#5cffe8", "#7c5cff"], ["#c65cff", "#5c8aff"],
  ["#ff5c94", "#ffb15c"], ["#5cff8a", "#5cd1ff"]
];
function avatarGradient(username) {
  let hash = 0;
  for (let i = 0; i < username.length; i++) hash = username.charCodeAt(i) + ((hash << 5) - hash);
  const [c1, c2] = AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
  return `linear-gradient(135deg, ${c1}, ${c2})`;
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

(async function boot() {
  const myFp = localStorage.getItem("xc_fp");
  const wrap = document.getElementById("friendsList");
  if (!myFp) { wrap.innerHTML = `<div class="empty-state">Pehle index.html open karo taaki identity ban sake.</div>`; return; }

  const { data: me } = await sb.from("users").select("*").eq("fingerprint", myFp).maybeSingle();
  if (!me) { wrap.innerHTML = `<div class="empty-state">Account nahi mila.</div>`; return; }

  const { data: follows } = await sb.from("follows").select("followee_id").eq("follower_id", me.id);
  if (!follows || follows.length === 0) { wrap.innerHTML = `<div class="empty-state">Aap abhi kisi ko follow nahi kar rahe.</div>`; return; }

  const { data: friends } = await sb.from("users").select("id, username, title").in("id", follows.map(f => f.followee_id));

  wrap.innerHTML = (friends || []).map(u => `
    <a href="profile.html?u=${u.id}" class="friend-card" style="text-decoration:none;color:inherit;">
      <div class="avatar" style="background:${avatarGradient(u.username)};">${u.username[0].toUpperCase()}</div>
      <span class="username">${escapeHtml(u.username)}</span>
      ${u.title ? `<span class="title-badge ${u.title === "God" ? "violet" : "grey"}">${u.title}</span>` : ""}
      <span class="unfollow-btn" data-id="${u.id}" style="margin-left:auto;font-size:11px;color:var(--danger);cursor:pointer;">Unfollow</span>
    </a>
  `).join("");

  wrap.querySelectorAll(".unfollow-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      await sb.from("follows").delete().eq("follower_id", me.id).eq("followee_id", btn.dataset.id);
      location.reload();
    });
  });
})();
</script>
</body>
</html>
