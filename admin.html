<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Court — Moderator</title>
<link rel="stylesheet" href="style.css" />
<style>
  table { width:100%; border-collapse: collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color: var(--text-dim); font-weight:600; }
  input.username-edit { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 8px; width:110px; }
  .gate { padding: 60px 20px; text-align:center; }
  .gate input { padding:10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); }
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Moderator Panel</h1></header>

  <div id="gate" class="gate">
    <p>Apna moderator fingerprint verify karo (browser console me "Your fingerprint:" dekho jab aap index.html visit karte ho).</p>
    <input id="fpInput" placeholder="Fingerprint yahan paste karo" />
    <button class="btn" id="gateBtn">Enter</button>
  </div>

  <div id="panel" style="display:none; padding:16px;">
    <h3>Live Visitors (<span id="liveCount">0</span>)</h3>
    <table>
      <thead><tr><th>Username</th><th>IP</th><th>Online since</th></tr></thead>
      <tbody id="visitorTable"></tbody>
    </table>

    <h3 style="margin-top:24px;">All Users — change username / assign title</h3>
    <table>
      <thead><tr><th>Username</th><th>Title</th><th>Fingerprint</th><th>IP</th><th>Blocked</th><th></th></tr></thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_s-aORJHy624eU2s1qzuAqA_3s1xK51R";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let MOD = null;
const TITLES = ["King", "Queen", "Joker", "Knight", "Demon Lord", "Demon Knight", "Demon Queen", "Slave", "Angel", "Trump"];

document.getElementById("gateBtn").addEventListener("click", async () => {
  const fp = document.getElementById("fpInput").value.trim();
  const { data } = await sb.from("users").select("*").eq("fingerprint", fp).eq("is_moderator", true).maybeSingle();
  if (!data) { alert("Ye fingerprint moderator ke tor par register nahi hai."); return; }
  MOD = data;
  document.getElementById("gate").style.display = "none";
  document.getElementById("panel").style.display = "block";
  loadUsers();
  watchPresence();
});

async function loadUsers() {
  const { data: users } = await sb.from("users").select("*").order("last_seen", { ascending: false });
  const tbody = document.getElementById("userTable");
  tbody.innerHTML = (users || []).map(u => `
    <tr data-id="${u.id}">
      <td><input class="username-edit" value="${u.username}" /></td>
      <td>
        ${u.is_moderator ? `<em>God (fixed)</em>` : `
        <select class="title-edit">
          <option value="">— none —</option>
          ${TITLES.map(t => `<option value="${t}" ${u.title === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>`}
      </td>
      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;">${u.fingerprint}</td>
      <td>${u.ip || "-"}</td>
      <td>${u.is_blocked ? "⚠️ yes" : "no"}</td>
      <td><button class="btn small saveBtn">Save</button></td>
    </tr>
  `).join("");

  tbody.querySelectorAll(".saveBtn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const row = e.target.closest("tr");
      const id = row.dataset.id;
      const newName = row.querySelector(".username-edit").value.trim();
      const titleSelect = row.querySelector(".title-edit");
      const updates = {};
      if (newName) updates.username = newName;
      if (titleSelect) {
        updates.title = titleSelect.value || null;
        updates.title_color = titleSelect.value ? "#9a9a9a" : null;
      }
      await sb.from("users").update(updates).eq("id", id);
      alert("Saved.");
      loadUsers();
    });
  });
}

function watchPresence() {
  const channel = sb.channel("live-visitors");
  channel
    .on("presence", { event: "sync" }, () => {
      const state = channel.presenceState();
      const rows = Object.values(state).flat();
      document.getElementById("liveCount").textContent = rows.length;
      document.getElementById("visitorTable").innerHTML = rows.map(r => `
        <tr><td>${r.username}</td><td>${r.ip || "-"}</td><td>${new Date(r.online_at).toLocaleTimeString()}</td></tr>
      `).join("");
    })
    .subscribe();
}
</script>
</body>
</html>
