<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Court</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <header class="top">
    <h1>The Court</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <a id="modPanelLink" href="admin.html" style="display:none;font-size:12px;font-weight:700;color:#fff;background:var(--accent-grad);padding:5px 12px;border-radius:999px;text-decoration:none;">⚙️ Moderator</a>
      <span class="visitor-pill"><span class="live-dot"></span><span id="visitorCount">0</span> online</span>
    </div>
  </header>

  <div id="blockedBanner" class="blocked-banner" style="display:none;"></div>

  <div style="padding:12px 14px 0;">
    <input id="searchInput" placeholder="🔍 Users ya posts search karo..." style="width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:10px 16px;font-size:14px;outline:none;" />
  </div>
  <div id="searchResults" style="display:none;padding:0 14px;"></div>

  <div class="composer">
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Posting as <strong id="whoami">...</strong> <span id="editUsernameBtn" style="cursor:pointer;color:var(--accent);">✏️</span></div>
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;">
      <span id="recoveryCodeBtn" style="cursor:pointer;color:var(--accent);">🔑 Recovery Code</span>
      <span id="restoreAccountBtn" style="cursor:pointer;color:var(--accent);">🔓 Restore Account</span>
    </div>
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;word-break:break-all;">Fingerprint: <span id="fpDisplay">...</span></div>
    <textarea id="postText" placeholder="Kya ho raha hai?"></textarea>
    <img id="imagePreview" style="display:none;max-width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--border);" />
    <div class="composer-footer">
      <div style="display:flex;align-items:center;gap:10px;">
        <label for="imageInput" style="cursor:pointer;font-size:18px;">🖼️</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" />
        <span class="char-count" id="charCount">0 / 250</span>
      </div>
      <button class="btn" id="postBtn" disabled>Post</button>
    </div>
  </div>

  <div id="feed"></div>
</div>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Embed SDKs (only fire on posts that actually contain these links) -->
<script async src="//www.instagram.com/embed.js"></script>
<script async src="https://platform.twitter.com/widgets.js"></script>

<script src="app.js"></script>
</body>
</html>
